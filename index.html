<!DOCTYPE html> 
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>RSP</title>
        <link rel="stylesheet" href="./css/styles.css">
        <link rel="apple-touch-icon" sizes="180x180" href="./Favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./Favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./Favicon/favicon-16x16.png">
        <link rel="manifest" href="./Favicon/site.webmanifest">
    </head>

    <body>

        <section id="battle">

            <h1 id="titleBattle">Rock, Paper Or Scissors</h1>

            <div id="goToBattle">

                <p id="battleTagline">Think you can beat the computer?</p>

                <div id="choicesPreview" role="img" aria-label="Rock, paper, and scissors">
                    <span aria-hidden="true">✊</span>
                    <span class="choices" aria-hidden="true">Or</span>
                    <span aria-hidden="true">✋</span>
                    <span class="choices" aria-hidden="true">Or</span>
                    <span aria-hidden="true">✌️</span>
                </div>

                <p id="battleInstructions">First to 3 wins · Enter 1 for rock, 2 for paper, or 3 for scissors.</p>
                <button id="startBattleButton">Challenge the computer</button>

            </div>

            <div id="battleChat" hidden>
                <div id="battleChatLayout">
                    <figure id="computerOpponent">
                        <img src="./Images/Computer-character.png" alt="Your computer opponent, a smiling character wearing red glasses">
                        <figcaption>Your opponent</figcaption>
                    </figure>
                    <div id="battleChatContent">
                        <p id="chatInstructions">First to 3 wins. Send 1 for rock, 2 for paper, or 3 for scissors.</p>
                        <div id="chatMessages" role="log" aria-live="polite" aria-relevant="additions"></div>

                        <form id="chatForm">
                            <label for="playerMessage">Your choice (1, 2, or 3)</label>
                            <div class="chatInputRow">
                                <input id="playerMessage" name="choice" type="text" inputmode="numeric" maxlength="1" autocomplete="off" required>
                                <button id="sendMessage" type="submit">Send</button>
                            </div>
                            <p id="inputError" role="alert"></p>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <section id="afterBattleMessage" hidden>

            <h1 id="titleAfterBattleMessage">Rock, Paper Or Scissors</h1>
            <h2 id="subtitle">Did You Win Or Lose?</h2>
            <h3 id="glazingPc">The Pc Is Very Good.</h3>
            <p id="finalScore"></p>
            <img id="rockPaperScissorsImage" src="https://img.freepik.com/vector-premium/piedra-papel-tijeras-mano-juego-icono-vector-ilustracion_602177-67.jpg" alt="Rock, paper, and scissors">

            <button id="restart">Restart</button>

        </section>
        
    </body>
    <script src="./js/script.js"></script>

</html>
