<!DOCTYPE html> 
<html>
    <head>
        <meta charset="utf-8" />
        <title>RSP</title>
        <link rel="stylesheet" href="./css/styles.css">
        <link rel="apple-touch-icon" sizes="180x180" href="./Favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./Favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./Favicon/favicon-16x16.png">
        <link rel="manifest" href="./Favicon/site.webmanifest">

    <body style="background-color:beige">

        <section id="battle">
            <h1 id="titleBattle">Rock, Paper Or Scissors</h1>

            <h2 id="subtitle">Did You Won Or Lost?<h2>
            <h3 id="glazingPc">The Pc Is Very Good.</h3>
            <img id="rockPaperScissorsImage" src="https://img.freepik.com/vector-premium/piedra-papel-tijeras-mano-juego-icono-vector-ilustracion_602177-67.jpg"/>

            <button id="restart">Restart</button>

        </section>

    <script src="./js/script.js"></script>
